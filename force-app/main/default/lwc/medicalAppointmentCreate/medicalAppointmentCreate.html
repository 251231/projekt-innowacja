<template>
    <lightning-card title="New Medical Appointment">

        <!-- RECORD TYPE -->
        <lightning-radio-group
            label="Visit Type"
            options={recordTypeOptions}
            value={recordType}
            onchange={handleRecordType}
            type="radio">
        </lightning-radio-group>

        <template if:true={recordTypeId}>

            <lightning-layout multiple-rows class="slds-m-top_medium">

                <lightning-layout-item size="6">
                    <lightning-combobox
                        label="Appointment Type"
                        options={appointmentTypeOptions}
                        value={appointmentType}
                        onchange={handleAppointmentType}
                        required>
                    </lightning-combobox>
                </lightning-layout-item>

                <lightning-layout-item size="6">
                    <lightning-combobox
                        label="Appointment Status"
                        options={appointmentStatusOptions}
                        value={appointmentStatus}
                        onchange={handleAppointmentStatus}
                        required>
                    </lightning-combobox>
                </lightning-layout-item>

                <lightning-layout-item size="6">
                    <lightning-combobox
                        label="Department"
                        options={departmentOptions}
                        value={department}
                        onchange={handleDepartment}
                        required>
                    </lightning-combobox>
                </lightning-layout-item>

                <lightning-layout-item size="6">
                    <lightning-input
                        type="datetime"
                        label="Appointment Date & Time"
                        value={appointmentDate}
                        onchange={handleDate}
                        required>
                    </lightning-input>
                </lightning-layout-item>

                <lightning-layout-item size="12">
                    <c-custom-lookup
                        label="Patient"
                        object-api-name="Person__c"
                        onselect={patientSelected}>
                    </c-custom-lookup>
                </lightning-layout-item>

                <lightning-layout-item size="6">
                    <c-custom-lookup
                        label="Doctor"
                        onsearch={searchDoctors}
                        onselect={doctorSelected}
                        onclear={doctorCleared}>
                    </c-custom-lookup>
                </lightning-layout-item>

                <lightning-layout-item size="6">
                    <c-custom-lookup
                        label="Medical Facility"
                        onsearch={searchFacilities}
                        onselect={facilitySelected}
                        onclear={facilityCleared}>
                    </c-custom-lookup>
                </lightning-layout-item>

                <lightning-layout-item size="12">
                    <lightning-textarea
                        label="Description"
                        value={description}
                        onchange={handleDescription}>
                    </lightning-textarea>
                </lightning-layout-item>

                <lightning-layout-item size="12" class="slds-m-top_medium">
                    <lightning-button
                        label="Save"
                        variant="brand"
                        onclick={save}>
                    </lightning-button>
                </lightning-layout-item>

            </lightning-layout>

        </template>

    </lightning-card>
</template>
