<template>
    <lightning-card title="Medical Facilities">
        <div class="slds-grid slds-gutters slds-p-around_medium">

            <div class="slds-col slds-size_2-of-3">
                <lightning-map
                    map-markers={mapMarkers}
                    center={polandCenter}
                    zoom-level={zoomLevel}
                    list-view="hidden">
                </lightning-map>
            </div>

            <div class="slds-col slds-size_1-of-3">
                <lightning-input
                    type="search"
                    label="Search by name"
                    value={searchKey}
                    onchange={handleSearch}>
                </lightning-input>

                <lightning-datatable
                    key-field="Id"
                    data={filteredFacilities}
                    columns={columns}
                    hide-checkbox-column>
                </lightning-datatable>
            </div>

        </div>
    </lightning-card>
</template>
